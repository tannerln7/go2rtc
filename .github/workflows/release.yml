name: Release

on:
  push:
    tags:
      - "v*-petlibro.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Validate tag and source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git tag --points-at HEAD)" = "${GITHUB_REF_NAME}"
          go test ./pkg/petlibro ./cmd/petlibro-resolve -count=1
          go test ./internal/streams -run '^Test(TimestampContinuity|StreamCorrelationIDs)' -count=1
          go test ./pkg/rtsp -run '^Test(PacketWriter|PacketWriters|WriteInterleavedData)' -count=1
          go vet ./internal/streams ./pkg/petlibro ./pkg/rtsp ./cmd/petlibro-resolve

      - name: Build release artifacts
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          set -euo pipefail
          mkdir -p dist

          # For every supported architecture, publish a standalone static
          # executable AND a tarball containing go2rtc, petlibro-resolve, and
          # both MIT license notices. The raw executable names are compatible
          # with external HA integrations that download and execute them directly.
          for target in amd64 arm64 armv7; do
            package_dir="dist/pkg_${target}"
            mkdir -p "$package_dir"
            raw_binary="dist/petlibro-go2rtc_linux_${target}"

            if [[ "$target" == armv7 ]]; then
              GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w" \
                -o "$raw_binary" .
              GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w" \
                -o "$package_dir/petlibro-resolve" ./cmd/petlibro-resolve
            else
              GOARCH="$target" go build -trimpath -ldflags="-s -w" \
                -o "$raw_binary" .
              GOARCH="$target" go build -trimpath -ldflags="-s -w" \
                -o "$package_dir/petlibro-resolve" ./cmd/petlibro-resolve
            fi

            cp "$raw_binary" "$package_dir/go2rtc"
            cp LICENSE "$package_dir/LICENSE-go2rtc"
            cp LICENSE-petlibro-local "$package_dir/LICENSE-petlibro-local"
            tar -C "$package_dir" -czf \
              "dist/go2rtc_${GITHUB_REF_NAME}_linux_${target}.tar.gz" \
              go2rtc petlibro-resolve LICENSE-go2rtc LICENSE-petlibro-local
          done

          # Keep the checksum-verified source release used by Petlibro builds.
          git archive --format=tar --prefix="go2rtc-${GITHUB_REF_NAME}/" HEAD \
            | gzip -n > "dist/go2rtc_${GITHUB_REF_NAME}_source.tar.gz"

          # Publish licenses separately for consumers of the raw executables.
          cp LICENSE dist/LICENSE-go2rtc
          cp LICENSE-petlibro-local dist/LICENSE-petlibro-local
          (cd dist && sha256sum go2rtc_*.tar.gz petlibro-go2rtc_linux_* LICENSE-* > SHA256SUMS)
          ./dist/petlibro-go2rtc_linux_amd64 -version

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-dev.') }}
          # Leave stable releases on the action's existing default behavior.
          make_latest: ${{ contains(github.ref_name, '-dev.') && 'false' || '' }}
          body_path: ${{ hashFiles(format('docs/releases/{0}.md', github.ref_name)) != '' && format('docs/releases/{0}.md', github.ref_name) || '' }}
          files: |
            dist/go2rtc_*.tar.gz
            dist/petlibro-go2rtc_linux_*
            dist/LICENSE-*
            dist/SHA256SUMS
